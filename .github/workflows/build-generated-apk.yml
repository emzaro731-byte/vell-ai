name: Build generated app APK and save it in this repository

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generated-apps/latest/index.html"

permissions:
  contents: write

concurrency:
  group: vell-generated-app-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the generated app
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter wrapper around the exact web preview
        shell: bash
        run: |
          set -euo pipefail
          test -s generated-apps/latest/index.html
          flutter create --platforms=android --org com.netville --project-name vell_generated_app apk_wrapper
          mkdir -p apk_wrapper/assets
          cp generated-apps/latest/index.html apk_wrapper/assets/app.html
          cat > apk_wrapper/pubspec.yaml <<'EOF'
          name: vell_generated_app
          description: Android APK generated by Vell AI from the latest app preview.
          publish_to: "none"
          version: 1.0.0+1
          environment:
            sdk: ">=3.3.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.10.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0
          flutter:
            uses-material-design: true
            assets:
              - assets/app.html
          EOF
          cat > apk_wrapper/lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const GeneratedApp());
          class GeneratedApp extends StatelessWidget {
            const GeneratedApp({super.key});
            @override
            Widget build(BuildContext context) => const MaterialApp(
              debugShowCheckedModeBanner: false,
              title: 'Vell Generated App',
              home: GeneratedAppPage(),
            );
          }
          class GeneratedAppPage extends StatefulWidget {
            const GeneratedAppPage({super.key});
            @override
            State<GeneratedAppPage> createState() => _GeneratedAppPageState();
          }
          class _GeneratedAppPageState extends State<GeneratedAppPage> {
            late final WebViewController controller;
            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF080B12))
                ..loadFlutterAsset('assets/app.html');
            }
            @override
            Widget build(BuildContext context) => Scaffold(
              body: SafeArea(child: WebViewWidget(controller: controller)),
            );
          }
          EOF
          # Keep Android INTERNET permission for apps that call external APIs.
          grep -q 'android.permission.INTERNET' apk_wrapper/android/app/src/main/AndroidManifest.xml || sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' apk_wrapper/android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies and analyze
        working-directory: apk_wrapper
        run: |
          flutter pub get
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib

      - name: Build release APK
        working-directory: apk_wrapper
        run: flutter build apk --release --tree-shake-icons

      - name: Prepare downloadable APK and ZIP in the same GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/latest
          cp apk_wrapper/build/app/outputs/flutter-apk/app-release.apk releases/latest/Vell-App.apk
          cat > releases/latest/README.txt <<'EOF'
          Vell AI generated Android app
          Vell-App.apk is built from generated-apps/latest/index.html.
          Each new Vell AI automatic build replaces this latest APK.
          EOF
          (cd releases/latest && zip -9 -q Vell-App-APK.zip Vell-App.apk README.txt)

      - name: Upload APK artifact as a backup
        uses: actions/upload-artifact@v4
        with:
          name: vell-generated-app-apk
          path: |
            releases/latest/Vell-App.apk
            releases/latest/Vell-App-APK.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK files into this repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/latest/Vell-App.apk releases/latest/Vell-App-APK.zip releases/latest/README.txt
          if git diff --cached --quiet; then
            echo "APK output unchanged; nothing to commit."
          else
            git commit -m "Build latest generated app APK"
            git push origin HEAD:main
          fi
