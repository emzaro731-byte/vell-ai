name: Build Vell AI Studio Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-android.yml"

permissions:
  contents: read

concurrency:
  group: vell-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate Flutter project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          flutter --version

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.netville.vellai .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-pub

      - name: Build optimized release APK
        run: flutter build apk --release --split-per-abi --tree-shake-icons --dart-define=VELL_API_BASE=https://vell-ai-1.onrender.com

      - name: Package APKs into a direct-download ZIP
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p release-package
          cp mobile/build/app/outputs/flutter-apk/*.apk release-package/
          cat > release-package/README.txt <<'EOF'
          Vell AI Studio Android APKs
          Install the APK matching your Android device CPU architecture.
          For most modern Android phones, try the arm64-v8a APK.
          EOF
          cd release-package
          zip -9 -r ../Vell-AI-Studio-APK.zip .

      - name: Upload APK ZIP and individual APKs
        uses: actions/upload-artifact@v4
        with:
          name: vell-ai-studio-apk-zip
          path: |
            Vell-AI-Studio-APK.zip
            mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
