name: Build Vell AI Studio Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.netville.vellai .
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --dart-define=VELL_API_BASE=https://vell-ai-1.onrender.com
      - uses: actions/upload-artifact@v4
        with:
          name: vell-ai-studio-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
