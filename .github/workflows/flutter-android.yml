name: Build Vell AI Studio Android APK (7 MB target)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-android.yml"

permissions:
  contents: read

concurrency:
  group: vell-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate Flutter project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          flutter --version

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.netville.vellai .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze app source (exclude generated template tests)
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib

      - name: Build smallest practical release APKs
        run: |
          flutter build apk --release --split-per-abi --tree-shake-icons --obfuscate --split-debug-info=build/symbols --dart-define=VELL_API_BASE=https://vell-ai-1.onrender.com
          echo "APK size report (target is 7 MB per APK; size depends on app assets and plugins):"
          for file in build/app/outputs/flutter-apk/*.apk; do
            bytes=$(stat -c%s "$file")
            mib=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b/1048576 }')
            echo "$file: $mib MiB ($bytes bytes)"
          done

      - name: Check APK size target
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          # Keep all ABI-specific APKs. A 7 MiB target is reported honestly;
          # fail only if no APK exists, since Flutter plugins may exceed the target.
          shopt -s nullglob
          apks=(mobile/build/app/outputs/flutter-apk/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No APKs were generated."
            exit 1
          fi
          for file in "${apks[@]}"; do
            bytes=$(stat -c%s "$file")
            if [ "$bytes" -gt 7340032 ]; then
              echo "::warning file=$file::APK is above the 7 MiB target (${bytes} bytes). Native Flutter engine and app dependencies set a practical size floor."
            else
              echo "7 MiB target met: $file (${bytes} bytes)"
            fi
          done

      - name: Package APKs and symbol files
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p release-package
          cp mobile/build/app/outputs/flutter-apk/*.apk release-package/
          cat > release-package/README.txt <<'EOF'
          Vell AI Studio Android APKs
          APKs are split by CPU architecture to reduce each download size.
          Install the APK matching your device. Most modern Android phones use arm64-v8a.
          Debug symbols are intentionally not included in this ZIP to keep the download small.
          EOF
          cd release-package
          zip -9 -r ../Vell-AI-Studio-APK.zip .

      - name: Upload APK ZIP and individual APKs
        uses: actions/upload-artifact@v4
        with:
          name: vell-ai-studio-apk-zip
          path: |
            Vell-AI-Studio-APK.zip
            mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
