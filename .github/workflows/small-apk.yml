name: Build Vell AI Flutter Universal APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffolding
        run: |
          flutter create --platforms=android --org com.vellai --project-name vell_ai_studio /tmp/vell-scaffold
          rm -rf mobile/android
          cp -R /tmp/vell-scaffold/android mobile/android
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' mobile/android/app/src/main/AndroidManifest.xml

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build optimized release APKs
        working-directory: mobile
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols --tree-shake-icons --dart-define=VELL_API_BASE=https://vell-ai-1.onrender.com

      - name: Report APK sizes
        shell: bash
        run: |
          shopt -s nullglob
          files=(mobile/build/app/outputs/flutter-apk/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No APKs were generated."
            exit 1
          fi
          for file in "${files[@]}"; do
            bytes=$(stat -c%s "$file")
            mib=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b/1048576 }')
            echo "$file: $mib MiB ($bytes bytes)"
          done

      - name: Package APKs and symbols
        run: |
          mkdir -p release-package
          cp mobile/build/app/outputs/flutter-apk/*.apk release-package/
          if [ -d mobile/build/symbols ]; then cp -R mobile/build/symbols release-package/; fi
          cd release-package
          zip -r ../Vell-AI-Flutter-APK.zip .

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vell-ai-flutter-apk
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            Vell-AI-Flutter-APK.zip
          if-no-files-found: error
          retention-days: 14
