name: Build Vell AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/small-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create lightweight Android WebView wrapper
        run: |
          mkdir -p mobile/www
          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>Loading Vell AI…</body></html>' > mobile/www/index.html
          cd mobile
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.vellai.studio",
            "appName": "Vell AI Studio",
            "webDir": "www",
            "server": {
              "url": "https://vell-ai-1.onrender.com",
              "cleartext": false,
              "allowNavigation": ["vell-ai-1.onrender.com"]
            }
          }
          EOF
          npx cap add android

      - name: Build APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: Report APK size
        run: |
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          du -h "$APK"

      - name: Upload APK and ZIP
        run: |
          mkdir -p release-package
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk release-package/Vell-AI-Studio.apk
          cd release-package
          zip ../Vell-AI-Studio-APK.zip Vell-AI-Studio.apk

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vell-ai-android-apk
          path: |
            release-package/Vell-AI-Studio.apk
            Vell-AI-Studio-APK.zip
          if-no-files-found: error
          retention-days: 14
