<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TikTok‑Style Feed</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#111;
    --text:#fff;
    --accent:#ff0050;
    --overlay:#0008;
    --icon-size:1.6rem;
    --font-sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--font-sans);
    background:var(--bg);
    color:var(--text);
    overflow-y:scroll;
    -webkit-overflow-scrolling:touch;
  }
  header{
    position:fixed;
    top:0;left:0;right:0;
    height:3rem;
    background:rgba(0,0,0,.6);
    display:flex;
    align-items:center;
    padding:0 1rem;
    z-index:10;
  }
  header h1{
    font-size:1.2rem;
    font-weight:600;
  }
  main{
    margin-top:3rem;
  }
  .video-card{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
  }
  .video-card video{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .overlay{
    position:absolute;
    inset:0;
    background:var(--overlay);
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:1rem;
    pointer-events:none;
  }
  .info{
    pointer-events:auto;
    max-width:70%;
  }
  .info h2{
    font-size:1rem;
    margin-bottom:.3rem;
  }
  .info p{
    font-size:.85rem;
    line-height:1.2;
  }
  .actions{
    position:absolute;
    right:1rem;
    bottom:4rem;
    display:flex;
    flex-direction:column;
    gap:.8rem;
    align-items:center;
    pointer-events:auto;
  }
  .action-btn{
    background:none;
    border:none;
    color:var(--text);
    font-size:var(--icon-size);
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
  }
  .action-btn span{
    font-size:.75rem;
    margin-top:.2rem;
  }
  .liked{
    color:var(--accent);
  }
  @media (min-width:600px){
    .actions{
      right:2rem;
    }
    .info{
      max-width:60%;
    }
  }
</style>
</head>
<body>
<header>
  <h1>TikTok Demo</h1>
</header>
<main id="feed" aria-live="polite"></main>

<script>
const videos = [
  {
    src:"https://www.w3schools.com/html/mov_bbb.mp4",
    user:"@alice",
    description:"Sunset vibes 🌅",
    likes:124,
    comments:8
  },
  {
    src:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
    user:"@bob",
    description:"Blooming flowers!",
    likes:87,
    comments:12
  },
  {
    src:"https://media.w3.org/2010/05/sintel/trailer_hd.mp4",
    user:"@charlie",
    description:"Adventure time 🚀",
    likes:203,
    comments:34
  }
];

// Simulate infinite scroll by repeating the array
let loadCount = 0;
function createCard(data){
  const card=document.createElement('article');
  card.className='video-card';
  card.innerHTML=`
    <video src="${data.src}" muted autoplay loop playsinline></video>
    <div class="overlay">
      <div class="info">
        <h2>${data.user}</h2>
        <p>${data.description}</p>
      </div>
      <div class="actions">
        <button class="action-btn like-btn" aria-label="Like" data-liked="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          <span class="like-count">${data.likes}</span>
        </button>
        <button class="action-btn comment-btn" aria-label="Comment">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M21 6h-2v9H5v2c0 .55.45 1 1 1h12l4 4V7c0-.55-.45-1-1-1zM3 4h14c.55 0 1 .45 1 1v9c0 .55-.45 1-1 1H5l-4 4V5c0-.55.45-1 1-1z"/></svg>
          <span>${data.comments}</span>
        </button>
        <button class="action-btn share-btn" aria-label="Share">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a2.5 2.5 0 0 0 0-1.4l7.05-4.11a2.5 2.5 0 1 0-.9-1.5L8 9.79a2.5 2.5 0 1 0 0 4.42l7.15 4.16c.52.48 1.2.78 1.96.78a2.5 2.5 0 1 0 0-5z"/></svg>
          <span>Share</span>
        </button>
      </div>
    </div>
  `;
  // Like button interaction
  const likeBtn=card.querySelector('.like-btn');
  const likeCountSpan=likeBtn.querySelector('.like-count');
  likeBtn.addEventListener('click',()=>{
    const liked=likeBtn.getAttribute('data-liked')==='true';
    if(liked){
      likeBtn.setAttribute('data-liked','false');
      likeBtn.classList.remove('liked');
      likeCountSpan.textContent=--data.likes;
    }else{
      likeBtn.setAttribute('data-liked','true');
      likeBtn.classList.add('liked');
      likeCountSpan.textContent=++data.likes;
    }
  });
  // Share interaction
  const shareBtn=card.querySelector('.share-btn');
  shareBtn.addEventListener('click',()=>{
    alert('Share link copied to clipboard (simulated).');
  });
  return card;
}
function loadMore(){
  const fragment=document.createDocumentFragment();
  for(let i=0;i<videos.length;i++){
    const idx=(loadCount*videos.length+i)%videos.length;
    const data=Object.assign({},videos[idx]); // clone
    fragment.appendChild(createCard(data));
  }
  document.getElementById('feed').appendChild(fragment);
  loadCount++;
}
function init(){
  loadMore();
  // Simple infinite scroll
  window.addEventListener('scroll',()=>{
    if(window.innerHeight+window.scrollY>=document.body.offsetHeight-100){
      loadMore();
    }
  });
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
