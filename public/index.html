<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#212121"><title>Vell AI — Chat</title>
<style>
:root{color-scheme:dark;--bg:#212121;--panel:#171717;--panel2:#2f2f2f;--line:#ffffff16;--text:#f4f4f4;--muted:#a1a1a1;--green:#10a37f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:260px;flex-shrink:0;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px;transition:transform .2s}.side-top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px}.brand{font-weight:750;font-size:18px;letter-spacing:-.5px}.brand span{color:#8ee5cc}.icon{background:transparent;border:0;color:#d4d4d4;border-radius:8px;padding:8px;font-size:18px}.icon:hover,.nav:hover{background:#ffffff10}.nav{display:flex;align-items:center;gap:10px;padding:10px;border:0;border-radius:9px;background:transparent;color:#eee;text-align:left;width:100%}.nav strong{font-weight:500}.side-label{font-size:12px;color:#8c8c8c;padding:20px 10px 5px}.history{color:#c9c9c9;font-size:13px;padding:9px 10px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history:hover{background:#ffffff0c}.profile{margin-top:auto;border-top:1px solid var(--line);padding:12px 4px 4px;display:flex;align-items:center;gap:10px;font-size:13px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#3e6257;font-weight:700}.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.topbar{height:56px;display:flex;align-items:center;gap:8px;padding:0 18px;flex-shrink:0}.model{font-size:17px;font-weight:600;letter-spacing:-.3px}.model small{color:#aaa;font-size:12px;font-weight:400;margin-left:5px}.top-right{margin-left:auto;display:flex;gap:8px}.pill{font-size:12px;border:1px solid var(--line);padding:6px 10px;border-radius:20px;color:#ddd}.conversation{flex:1;overflow:auto;padding:18px 20px 180px;scroll-behavior:smooth}.welcome{max-width:760px;margin:12vh auto 0;text-align:center}.welcome h1{font-size:clamp(27px,4vw,36px);font-weight:600;letter-spacing:-1px;margin:0 0 28px}.welcome h1 span{color:#b6b6b6}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:left}.suggestion{background:transparent;border:1px solid #ffffff24;border-radius:15px;padding:14px;color:#e4e4e4;text-align:left}.suggestion:hover{background:#ffffff0a}.suggestion b{display:block;font-size:14px;font-weight:550}.suggestion span{display:block;color:#9c9c9c;font-size:12px;margin-top:3px}.message{max-width:760px;margin:0 auto 26px;display:flex;gap:13px;align-items:flex-start}.message.user{justify-content:flex-end}.message .bubble{max-width:calc(100% - 45px);white-space:pre-wrap;overflow-wrap:anywhere}.message.user .bubble{background:#303030;border-radius:20px;padding:11px 16px}.message .avatar{flex-shrink:0;width:30px;height:30px;background:#10a37f;color:#fff}.assistant-text{padding:3px 0;white-space:normal}.assistant-text p{margin:0 0 12px}.composer-wrap{position:absolute;bottom:0;left:0;right:0;padding:20px 20px 12px;background:linear-gradient(transparent,var(--bg) 18%)}.composer{max-width:790px;margin:auto;background:#2f2f2f;border:1px solid #ffffff20;border-radius:25px;padding:10px 12px 8px;box-shadow:0 8px 30px #0002}.composer textarea{width:100%;min-height:32px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:#f4f4f4;padding:5px 7px;display:block}.composer textarea::placeholder{color:#aaa}.compose-bottom{display:flex;align-items:center;gap:8px}.toolbtn{border:0;background:transparent;color:#ddd;border-radius:50%;width:34px;height:34px;font-size:20px}.toolbtn:hover{background:#ffffff14}.send{margin-left:auto;width:34px;height:34px;border:0;border-radius:50%;background:#f4f4f4;color:#171717;font-weight:800;font-size:18px}.send:disabled{opacity:.4}.under{max-width:790px;margin:8px auto 0;text-align:center;font-size:11px;color:#929292}.status{max-width:790px;margin:8px auto 0;font-size:12px;color:#aaa;overflow-wrap:anywhere}.error{color:#ff9999}.build-tools{max-width:790px;margin:12px auto 0;display:flex;gap:8px;flex-wrap:wrap}.smallbtn{background:#2f2f2f;border:1px solid #ffffff20;color:#eee;border-radius:10px;padding:8px 11px;font-size:12px}.smallbtn:disabled{opacity:.4}.previewbox{max-width:790px;margin:14px auto;background:#fff;border-radius:12px;overflow:hidden;height:360px;display:none}.previewbox iframe{width:100%;height:100%;border:0;background:white}.hidden{display:none!important}@media(max-width:700px){.sidebar{position:absolute;z-index:5;inset:0 auto 0 0;box-shadow:10px 0 50px #0007;transform:translateX(-105%)}.sidebar.open{transform:translateX(0)}.topbar{padding:0 10px}.conversation{padding:12px 14px 200px}.composer-wrap{padding:14px 10px 10px}.welcome{margin-top:9vh}.suggestions{grid-template-columns:1fr}.welcome h1{margin-bottom:22px}.pill{display:none}.previewbox{height:280px}}
</style></head><body><div class="app">
<aside class="sidebar" id="sidebar"><div class="side-top"><div class="brand">Vell <span>AI</span></div><button class="icon" id="closeSide" aria-label="Close menu">◧</button></div>
<button class="nav" id="newChat"><span>＋</span><strong>New chat</strong></button><button class="nav" id="focusPrompt"><span>⌕</span><strong>Build a website</strong></button><button class="nav" id="showPreview"><span>▧</span><strong>Preview website</strong></button>
<div class="side-label">Your conversations</div><div class="history">Website builder session</div><div class="history">Create a portfolio</div><div class="history">Build an online store</div><div class="profile"><div class="avatar">V</div><div><b>Vell AI Studio</b><div style="color:#999;font-size:11px">AI website builder</div></div></div></aside>
<main class="main"><header class="topbar"><button class="icon" id="menu" aria-label="Open menu">☰</button><div class="model">Vell AI <small>⌄</small></div><div class="top-right"><span class="pill">Website Builder</span></div></header>
<section class="conversation" id="conversation" aria-live="polite"><div class="welcome" id="welcome"><h1>What can I help you <span>build?</span></h1><div class="suggestions"><button class="suggestion" data-p="Create a modern portfolio website for a Nigerian software developer with projects, skills, about and contact sections."><b>✦ Create a portfolio</b><span>Showcase your work and skills</span></button><button class="suggestion" data-p="Create a premium Nigerian fashion online store with product cards, naira prices, category filters and WhatsApp order buttons."><b>▦ Build an online store</b><span>Products, prices and ordering</span></button><button class="suggestion" data-p="Create a modern digital agency website offering web design, mobile apps, branding and AI automation."><b>⌘ Launch a business site</b><span>Turn your idea into a website</span></button><button class="suggestion" data-p="Build a responsive SaaS landing page with pricing, feature sections, testimonials and a call to action."><b>⚡ Design a landing page</b><span>Promote a product or service</span></button></div></div><div id="messages"></div><div class="previewbox" id="preview"><iframe id="frame" title="Generated website preview" sandbox="allow-scripts allow-forms"></iframe></div></section>
<div class="composer-wrap"><div class="composer"><textarea id="prompt" rows="1" aria-label="Message Vell AI" placeholder="Message Vell AI or describe the website you want…"></textarea><div class="compose-bottom"><button class="toolbtn" id="attach" title="Add a website idea">＋</button><button class="toolbtn" id="example" title="Insert an example">☷</button><span style="font-size:11px;color:#aaa">AI builder</span><button class="send" id="generate" aria-label="Send message">↑</button></div></div><div class="build-tools"><button class="smallbtn" id="download" disabled>↓ Download HTML</button><button class="smallbtn" id="publish" disabled>↗ Publish to GitHub</button><button class="smallbtn" id="buildDeploy" disabled>⚡ Build & deploy on Render</button></div><div id="status" class="status" role="status">Ready when you are.</div><div class="under">Vell AI can make mistakes. Review generated websites before publishing.</div></div></main></div>
<script>
const $=id=>document.getElementById(id);let html='',busy=false;function msg(s,e=false){$('status').textContent=s;$('status').className='status'+(e?' error':'')}function addMessage(text,who){$('welcome').classList.add('hidden');const row=document.createElement('div');row.className='message '+who;const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;if(who==='assistant'){const av=document.createElement('div');av.className='avatar';av.textContent='V';row.append(av);const formatted=document.createElement('div');formatted.className='assistant-text';formatted.textContent=text;bubble.replaceWith(formatted);row.append(formatted)}else row.append(bubble);$('messages').append(row);$('conversation').scrollTop=$('conversation').scrollHeight;return row}async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function setBusy(v){busy=v;$('generate').disabled=v;$('generate').textContent=v?'…':'↑';}
async function generate(){if(busy)return;const p=$('prompt').value.trim();if(!p)return;addMessage(p,'user');$('prompt').value='';$('prompt').style.height='auto';setBusy(true);const loading=addMessage('Thinking… I’m building your website now.','assistant');msg('Generating your website…');try{const d=await post('/api/generate',{prompt:p});html=d.html;loading.querySelector('.assistant-text').textContent='Your website is ready. I’ve created the first version below. Review the preview, then download it or publish it to GitHub and Render.';$('frame').srcdoc=html;$('preview').style.display='block';['download','publish','buildDeploy'].forEach(id=>$(id).disabled=false);msg('Website generated successfully. Review it before publishing.');$('conversation').scrollTop=$('conversation').scrollHeight}catch(e){loading.querySelector('.assistant-text').textContent='I couldn’t generate the website: '+e.message;msg(e.message,true)}finally{setBusy(false)}}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset.p;$('prompt').focus()});$('generate').onclick=generate;$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();generate()}});$('prompt').addEventListener('input',()=>{$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,180)+'px'});$('newChat').onclick=()=>{$('messages').replaceChildren();$('welcome').classList.remove('hidden');$('preview').style.display='none';$('prompt').value='';html='';['download','publish','buildDeploy'].forEach(id=>$(id).disabled=true);msg('New chat started.');$('sidebar').classList.remove('open')};$('menu').onclick=()=>$('sidebar').classList.toggle('open');$('closeSide').onclick=()=>$('sidebar').classList.remove('open');$('focusPrompt').onclick=()=>{$('prompt').focus();$('sidebar').classList.remove('open')};$('showPreview').onclick=()=>{$('preview').style.display=html?'block':'none';$('sidebar').classList.remove('open');$('conversation').scrollTop=$('conversation').scrollHeight};$('attach').onclick=()=>{$('prompt').value+=($('prompt').value?' ':'')+'Make the design responsive and mobile-friendly.';$('prompt').focus()};$('example').onclick=()=>{$('prompt').value='Create a clean, modern website with a dark theme, responsive layout, clear navigation and polished interactions.';$('prompt').focus()};$('download').onclick=()=>{if(!html)return;const u=URL.createObjectURL(new Blob([html],{type:'text/html'})),a=document.createElement('a');a.href=u;a.download='index.html';a.click();URL.revokeObjectURL(u);msg('HTML downloaded.')};$('publish').onclick=async()=>{if(!html)return;$('publish').disabled=true;msg('Publishing website to GitHub…');try{const d=await post('/api/publish',{html});msg(d.message+(d.commit?' '+d.commit:''));addMessage('GitHub publish result: '+d.message,'assistant')}catch(e){msg(e.message,true)}finally{$('publish').disabled=false}};$('buildDeploy').onclick=async()=>{const p=$('prompt').value.trim()||'Improve and deploy the website I just generated.';$('buildDeploy').disabled=true;msg('Asking Render to build and deploy…');try{const d=await post('/api/build-and-deploy',{prompt:p});if(d.html){html=d.html;$('frame').srcdoc=html;$('preview').style.display='block'}const links=[d.siteUrl?'Live site: '+d.siteUrl:'',d.repository?'GitHub: '+d.repository:'',d.dashboardUrl?'Render dashboard: '+d.dashboardUrl:''].filter(Boolean);const result=d.message+' '+links.join(' | ');msg(result);addMessage(result,'assistant')}catch(e){msg(e.message,true);addMessage('Deployment failed: '+e.message,'assistant')}finally{$('buildDeploy').disabled=!html}};$('prompt').focus();
</script></body></html>
