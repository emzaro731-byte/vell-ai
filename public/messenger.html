<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b18"><title>Vell Chat</title><link rel="stylesheet" href="/messenger.css"></head>
<body><main class="shell"><aside class="side"><header class="brand"><a href="/">‹ Vell AI</a><strong>Vell Chat</strong><button id="signout" class="ghost hidden">Sign out</button></header>
<section id="auth" class="auth"><div class="logo">V</div><h1>Your people,<br><em>one message away.</em></h1><p>Sign in or create an account to start chatting.</p><form id="authform"><input id="email" type="email" autocomplete="email" placeholder="Email address" required><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="Password (6+ characters)" required><input id="displayname" placeholder="Your display name (for sign up)" maxlength="40"><div class="authbuttons"><button id="login" type="submit">Sign in</button><button id="signup" type="button" class="secondary">Create account</button></div></form><p id="authstatus" class="notice"></p></section>
<section id="inbox" class="hidden"><div class="me"><div id="myavatar" class="avatar">V</div><div><b id="myname">My account</b><small id="myemail"></small></div></div><form id="contactform" class="addcontact"><input id="contactemail" type="email" placeholder="Add contact by email" required><button title="Add contact">＋</button></form><button id="newgroup" class="newgroup">＋ Create group chat</button><h2>CHATS <span id="chatcount">0</span></h2><div id="chatlist" class="chatlist"></div></section>
</aside><section class="conversation"><div id="empty" class="empty"><div class="logo">✳</div><h2>Chat without the noise.</h2><p>Choose a conversation or add a contact to get started.</p></div><div id="room" class="room hidden"><header class="roomhead"><div id="roomavatar" class="avatar">V</div><div><b id="roomtitle">Conversation</b><small id="roomsubtitle">Messages are synced in real time</small></div><button id="refresh" class="ghost" title="Refresh">↻</button></header><div id="messages" class="messages"></div><div id="uploadstatus" class="notice"></div><form id="sendform" class="sendform"><label class="attach" title="Attach image or file">＋<input id="media" type="file" accept="image/*,video/*,audio/*,.pdf,.txt" hidden></label><textarea id="messageinput" rows="1" maxlength="4000" placeholder="Write a message…" required></textarea><button id="send" type="submit" aria-label="Send message">↑</button></form></div></section></main><div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/messenger.js" defer></script></body></html>
